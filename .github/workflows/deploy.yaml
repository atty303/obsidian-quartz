name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          github_token: ${{ github.token }}

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache database
        uses: actions/cache@v4
        with:
          path: .db
          key: ${{ runner.os }}-ols-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ols-db-

      - name: Export Vault
        uses: atty303/obsidian-livesync-cli/actions/export@main
        with:
          database-path: .db
          output-path: content
          remote-access-key: ${{ secrets.OLS_REMOTE_ACCESS_KEY }}
          remote-secret-key: ${{ secrets.OLS_REMOTE_SECRET_KEY }}
          remote-region: us-east-1
          remote-endpoint: ${{ secrets.OLS_REMOTE_ENDPOINT }}
          remote-bucket: obsidian-personal
          remote-force-path-style: true

      - name: Build
        run: mise run build

      - name: Deploy
        run: mise run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
