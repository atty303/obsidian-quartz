name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
#  schedule:
#    - cron: '*/15 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          github_token: ${{ github.token }}

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache obsidian-headless config
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.obsidian-headless
          key: ${{ runner.os }}-ob-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ob-

      - name: Setup vault
        env:
          OBSIDIAN_TOKEN: ${{ secrets.OBSIDIAN_TOKEN }}
        run: |
          mkdir -p ~/.config/obsidian-headless
          echo "$OBSIDIAN_TOKEN" > ~/.config/obsidian-headless/auth_token
          mise run ob:sync-setup

      - name: Sync vault
        run: mise run ob:sync

      - name: Build
        run: mise run build

      - name: Deploy
        run: mise run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
