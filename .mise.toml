[settings]
idiomatic_version_file_enable_tools = []

[tools]
node = "22.16.0"
"npm:wrangler" = "latest"
"npm:obsidian-headless" = "latest"

[tasks.install]
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs.auto = true

[tasks.build]
run = "npx quartz build"
depends = "install"

[tasks.serve]
run = "npx quartz build --serve"
depends = "install"

[tasks.deploy]
run = "wrangler deploy"

[tasks."ob:login"]
run = "ob login --email $OBSIDIAN_SYNC_EMAIL --password $OBSIDIAN_SYNC_PASSWORD"

[tasks."ob:token"]
run = "cat ~/.config/obsidian-headless/auth_token"

[tasks."ob:sync-setup"]
dir = "content"
run = [
    "ob sync-setup --vault 4a537549e8d60a0ff46bd6513cc46293 --device-name obsidian-quartz",
    "ob sync-config --mode mirror-remote",
    "ob sync-config",
]

[tasks."ob:sync"]
dir = "content"
run = "ob sync"
